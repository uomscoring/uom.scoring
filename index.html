<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universe of Music TEST</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0a0a0a; color: white; font-family: 'Prompt', sans-serif; }
  h1 { font-family: 'Anton', sans-serif; letter-spacing: 2px; }
  .rank-1 { background: linear-gradient(90deg, #FF0088, #D800FF); color: black; }
  .rank-2 { background: linear-gradient(90deg, #15FF00, #A9FF00); color: black; }
  .rank-3 { background: linear-gradient(90deg, #CD7F32, #A0522D); color: white; }
</style>
</head>
<body class="p-4 md:p-8">

<h1 class="text-4xl md:text-5xl font-bold text-center mb-2">LIVE TOP 100 TEST</h1>

<div id="chart" class="max-w-3xl mx-auto space-y-3"></div>

<script>
const allData = [
  {artistTitle: "Taylor Swift - Cruel Summer", pba: 2, dnu: 15, score: 9850000},
  {artistTitle: "The Weeknd - Blinding Lights", pba: -1, dnu: 8, score: 9720000},
  {artistTitle: "NewJeans - Super Shy", pba: 5, dnu: 22, score: 9610000},
  {artistTitle: "Drake - IDGAF", pba: 0, dnu: 5, score: 9500000},
  {artistTitle: "Billie Eilish - birds of a feather", pba: 3, dnu: 18, score: 9430000},
];

function renderChart(data) {
  const chartDiv = document.getElementById('chart');
  chartDiv.innerHTML = '';
  data.forEach((item, i) => {
    const rank = i + 1;
    const rankClass = rank === 1? `rank-1` : rank === 2? `rank-2` : rank === 3? `rank-3` : 'bg-gray-800';
    chartDiv.innerHTML += `
      <div class="flex items-center gap-4 p-4 rounded-lg ${rankClass} shadow-lg">
        <div class="text-3xl font-extrabold w-[70px] text-center">#${rank}</div>
        <div class="flex-1">
          <p class="font-semibold text-lg">${item.artistTitle}</p>
          <p class="text-xs opacity-80">SCORE: ${item.score.toLocaleString('id-ID')}</p>
        </div>
      </div>
    `;
  });
}
renderChart(allData);
</script>
</body>
</html>
