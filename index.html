<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UOM SCORING - LIVE TOP 100</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; padding: 20px; }
        h1 { text-align: center; color: #38bdf8; }
        #status { text-align: center; margin: 20px; }
        canvas { background: #1e293b; border-radius: 10px; padding: 10px; height: 2000px!important; }
    </style>
</head>
<body>
    <h1>🏆 LIVE TOP 100 UOM SCORING</h1>
    <div id="status">Loading data...</div>
    <canvas id="myChart"></canvas>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT2ZX1gsf_L1_ioUZLmBVEwCIolt92WicQKJkoM0nn3p7A2GrBfoiQMZVOHvhXJ4ISBkK_pWzmvntyx/pub?gid=1352500872&single=true&output=csv';

        // Fungsi buat baca CSV yg bener, walau ada koma di dalam ""
        function parseCSV(text) {
            const rows = [];
            let row = [], cell = '', inQuotes = false;
            for(let i=0; i<text.length; i++){
                const char = text[i], next = text[i+1];
                if(char === '"' && inQuotes && next === '"'){ cell += '"'; i++; }
                else if(char === '"'){ inQuotes =!inQuotes; }
                else if(char === ',' &&!inQuotes){ row.push(cell); cell = ''; }
                else if(char === '\n' &&!inQuotes){ row.push(cell); rows.push(row); row=[]; cell=''; }
                else { cell += char; }
            }
            row.push(cell); rows.push(row);
            return rows;
        }

        async function fetchData() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                const rows = parseCSV(csvText);

                const headers = rows[0].map(h => h.trim());
                const data = rows.slice(1).map(row => {
                    let obj = {};
                    headers.forEach((header, i) => {
                        obj[header] = row[i]? row[i].trim() : '';
                    });
                    return obj;
                }).filter(row => row.NAMA && row.SKOR && row.SKOR!== 'SKOR');

                document.getElementById('status').textContent = `Data berhasil: ${data.length} tim ditemukan`;

                data.sort((a, b) => parseFloat(b.SKOR) - parseFloat(a.SKOR));
                const top100 = data.slice(0, 100);

                new Chart(document.getElementById('myChart'), {
                    type: 'bar',
                    data: {
                        labels: top100.map(r => r.NAMA),
                        datasets: [{
                            label: 'SKOR',
                            data: top100.map(r => parseFloat(r.SKOR)),
                            backgroundColor: '#38bdf8'
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } }
                    }
                });

            } catch (error) {
                document.getElementById('status').textContent = 'ERROR: ' + error.message;
            }
        }
        fetchData();
    </script>
</body>
</html>
