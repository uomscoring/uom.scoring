<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT2ZX1gsf_L1_ioUZLmBVEwCIolt92WicQKJkoM0nn3p7A2GrBfoiQMZVOHvhXJ4ISBkK_pWzmvntyx/pub?gid=1352500872&single=true&output=csv';

    async function fetchData() {
        document.getElementById('status').textContent = 'Mengambil data dari Google Sheet...';

        try {
            // LANGSUNG FETCH CSV, GA PAKE PROXY LAGI
            const response = await fetch(SHEET_URL);
            if (!response.ok) throw new Error('Gagal fetch: ' + response.status);

            const csvText = await response.text();
            const rows = csvText.split('\n').map(row => row.split(','));

            const headers = rows[0].map(h => h.trim());
            const data = rows.slice(1).map(row => {
                let obj = {};
                headers.forEach((header, i) => {
                    obj[header] = row[i]? row[i].trim() : '';
                });
                return obj;
            }).filter(row => row['NAMA']); // filter baris kosong

            document.getElementById('status').textContent = `Data berhasil dimuat: ${data.length} tim`;
            renderChart(data);

        } catch (error) {
            document.getElementById('status').textContent = 'GAGAL: ' + error.message;
            console.error(error);
        }
    }

    function renderChart(data) {
        // sort by SKOR tertinggi
        data.sort((a, b) => parseFloat(b.SKOR) - parseFloat(a.SKOR));
        const top100 = data.slice(0, 100);

        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: top100.map(r => r.NAMA),
                datasets: [{
                    label: 'SKOR',
                    data: top100.map(r => parseFloat(r.SKOR)),
                    backgroundColor: 'rgba(54, 162, 235, 0.6)'
                }]
            },
            options: {
                indexAxis: 'y', // biar horizontal
                responsive: true,
                plugins: { legend: { display: false } }
            }
        });
    }

    fetchData();
</script>
